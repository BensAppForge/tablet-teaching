<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Offline – Tablet Teaching</title>
		<link rel="icon" href="/app-icon.svg" />
		<style>
			:root { color-scheme: light dark; }
			* { box-sizing: border-box; }
			body {
				margin: 0;
				min-height: 100dvh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
					Helvetica, Arial, sans-serif;
				background: #ffffff;
				color: #1f2937;
			}
			@media (prefers-color-scheme: dark) {
				body { background: #08111f; color: #e5e7eb; }
				.card { background: #0f1b2d; border-color: #1f2a3a; }
			}
			.card {
				max-width: 26rem;
				width: 100%;
				text-align: center;
				border: 1px solid #e5e7eb;
				border-radius: 16px;
				padding: 32px 24px;
			}
			.icon { width: 64px; height: 64px; margin: 0 auto 16px; display: block; }
			h1 { font-size: 1.25rem; margin: 0 0 8px; }
			p { margin: 0 0 20px; font-size: 0.95rem; line-height: 1.5; opacity: 0.8; }
			button {
				appearance: none;
				border: 0;
				border-radius: 10px;
				background: #e97822;
				color: #fff;
				font-size: 1rem;
				font-weight: 600;
				padding: 12px 20px;
				cursor: pointer;
			}
			button:active { opacity: 0.85; }
		</style>
	</head>
	<body>
		<div class="card">
			<img class="icon" src="/app-icon.svg" alt="Tablet Teaching" />
			<h1>Keine Verbindung</h1>
			<p>
				Du bist gerade offline. Bereits geladene Inhalte bleiben verfügbar.
				Bearbeitete Antworten werden lokal gespeichert und gehen nicht
				verloren. Sobald du wieder online bist, lädt die App normal.
			</p>
			<button type="button" onclick="location.reload()">Erneut versuchen</button>
		</div>
	</body>
</html>
